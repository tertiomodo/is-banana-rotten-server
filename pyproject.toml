[project]
name = "is-banana-rotten-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "python-multipart>=0.0.33",
]

[project.scripts]
